# Repository mirrors are configured in build.gradle.kts. Do not force a local
# proxy here because a closed localhost port makes every dependency appear
# unavailable even when Aliyun or Maven Central is reachable.

# Paper API used for COMPILATION ONLY.
#
# Paper's own coordinate scheme, verified against
# https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml
# The artifact version is not a plain Minecraft version: it is
# <mc-version>.build.<n>-<channel>, and the game version it targets is the
# leading component (26.2 here).
#
# This is deliberately the newest API, not the oldest supported server. The
# plugin runs on 1.8 through the current line, so compiling against the newest
# API and probing capabilities at runtime is what keeps one jar working across
# that range - see NmsCapabilities and the per-generation nms modules. Never
# call a Paper-only or version-new method from main sources without a probe.
paperApiVersion=26.2.build.123-stable
