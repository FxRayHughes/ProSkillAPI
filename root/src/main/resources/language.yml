Notifications:
  #如果cast: '闭嘴' 将不会提示释放技能 单独写在技能里也生效(只要是包含闭嘴就不提示
  cast: '&6{player} &2释放了技能 &6{skill}'
  gain-exp: '&2你获得了 &6{exp} 点经验'
  gain-lvl: '&6升级成功！&2你现在是 &6{class} {level}级'
  lose-exp: '&4你失去了 &6{class} &4的 &6{exp} 点经验'
Errors:
  on-cooldown: '&6{skill} &4正在冷却，还需 &6{cooldown} &4秒'
  no-mana: '&4还需要 &6{missing} &4点魔力'
  no-skills: '&4该职业没有可用技能'
  cannot-use: '&4你无法装备该物品'
GUI:
  attribute-title: '属性（{points} 点）'
  profess-title: '转职'
  skill-tree: '{class}'
  skill-class-list: '{player}'
Skill Tree:
  title: '{name} ({level}/{max})'
  type: '&2技能类型：&6{name}'
  requirement:
    met: '&2'
    not-met: '&4'
  attribute:
    changing: '&6{value} -> {new}'
    not-changing: '&6{value}'
  layout:
  - '&d{name} &7({level}/{max})'
  - '&2类型：&6{type}'
  - ''
  - '{req:lvl}等级：{attr:level}'
  - '{req:cost}消耗：{attr:cost}'
  - ''
  - '&2魔力：{attr:mana}'
  - '&2冷却：{attr:cooldown}'
  - '&2范围：{attr:range}'
  - ''
  - '&2详情：&7{desc:1}'
  - '&7{desc:2-x}'
Stats:
  health: '&2生命'
  points: '&2技能点'
  level: '&2等级'
  exp: '&2经验'
  attrib: '&2属性点'
Status:
  silenced: '&4你被沉默，还需 &6{duration} &4秒'
  stunned: '&4你被眩晕，还需 &6{duration} &4秒'
  rooted: '&4你被定身，还需 &6{duration} &4秒'
  disarmed: '&4你被缴械，还需 &6{duration} &4秒'
  invincible: '&4目标处于无敌状态，还需 &6{duration} &4秒'
  absorbed: '&4目标正在吸收攻击恢复生命，还需 &6{duration} &4秒'
  channeling: '&4你仍在引导技能，还需 &6{duration} &4秒'
Combo:
  left: '&6左键'
  right: '&6右键'
  shift: '&6潜行'
  left_shift: '&6左键潜行'
  right_shift: '&6右键潜行'
  space: '&6跳跃'
  q: '&6丢弃'

