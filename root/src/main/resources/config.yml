# ---------------------------------------------- #
#              SkillAPI 主配置文件                #
# ---------------------------------------------- #
# 插件官网:                                       #
# http://dev.bukkit.org/bukkit-plugins/skillapi/  #
# ---------------------------------------------- #
Accounts:
  #
  # GUI显示中使用的主职业组
  main-class-group: class
  #
  # 暂时禁用，忽略此项
  one-per-class: false
  #
  # 普通玩家可使用的最大账号数量
  max-accounts: 3
  #
  # 拥有特定权限的玩家可拥有的最大账号数
  # 格式: '<权限节点>:<账号数>'
  perm-accounts:
  - 'skillapi.account.admin:10'
#
# 目标选择设置
Targeting:
  #
  # 是否将所有怪物视为敌人
  # 如果宠物包含僵尸/蜘蛛等，不要启用
  monsters-enemy: false
  #
  # 是否将所有被动生物视为友军
  passive-ally: false
  #
  # 是否将所有玩家视为友军（有PvP时不要启用）
  player-ally: false
#
# 数据保存设置
Saving:
  #
  # 是否定期自动保存数据
  auto-save: false
  #
  # 自动保存间隔（分钟）
  minutes: 30
  #
  # 是否使用SQL数据库保存
  sql-database: false
  #
  # 数据库连接详情
  sql-details:
    host: localhost
    port: 54321
    database: plugins
    username: username
    password: password
    delay: 0
#
# 职业设置
Classes:
  #
  # 是否使用SkillAPI的生命值系统
  # SX-Attribute 握手开启时由 SX 独占写入 Bukkit 最大生命，避免重复 modifier。
  modify-health: false
  #
  # 没有职业的玩家的默认生命值
  classless-hp: 20
  #
  # 是否显示自动升级的非施放型技能
  show-auto-skills: false
  #
  # 是否启用属性系统
  attributes-enabled: true
  #
  # 是否允许退还属性点
  attributes-downgrade: false
  #
  # 升级时施放的动态技能（用于升级特效）
  level-up-skill: 'lvlup'
#
# ---------------------------------------------- #
#              战斗属性设置                        #
# ---------------------------------------------- #
Combat:
  #
  # 暴击基础倍率（1.75 = 175%伤害）
  base-crit-damage: 1.75
  #
  # 各战斗属性的基础值
  base-values:
    crit-rate: '100.0'
    crit-damage: '100.0'
    dodge: '100.0'
    lifesteal: '100.0'
    armor-penetration: '100.0'
    threat-power: '100.0'
    tenacity: '100.0'
    control-power: '100.0'
    control-resistance: '100.0'
  #
  # 各战斗属性的计算模式
  # inverse(递减): 适用公式 v/(a*0.01+1), 取 base - scaled, 属性越高增益递减
  # additive(线性): 适用公式 a+v 或 a*0.5+v, 取 scaled - base, 属性=直接增益值
  calc-mode:
    crit-rate: 'inverse'
    crit-damage: 'inverse'
    dodge: 'inverse'
    lifesteal: 'inverse'
    armor-penetration: 'inverse'
    # 仇恨强度: additive(线性)推荐，属性值直接等于仇恨加成百分比
    threat-power: 'additive'
    # 韧性：additive 推荐（属性值直接等于抵消百分比）
    tenacity: 'additive'
    # 控制强度：additive 推荐（属性值直接等于增加百分比）
    control-power: 'additive'
    # 控制抗性：additive 推荐（属性值直接等于抵消百分比）
    control-resistance: 'additive'
  #
  # 战斗属性对应的属性名称
  attributes:
    crit-rate: '暴击率'
    crit-damage: '暴击伤害'
    dodge: '闪避'
    lifesteal: '吸血'
    armor-penetration: '破甲'
    threat-power: '仇恨强度'
    # 韧性：降低受到的暴击"额外"伤害。100 表示暴击等同于普通伤害
    tenacity: '韧性'
    # 控制强度：按百分比提升自身对目标施加的眩晕/禁锢/沉默时长
    control-power: '控制强度'
    # 控制抗性：按百分比降低自身受到的眩晕/禁锢/沉默时长
    control-resistance: '控制抗性'
  #
  # 战斗消息配置
  message:
    enabled: true
    deal-damage: '&8>> &7你对 &f{target} &7造成了 &c{damage} &7点伤害'
    deal-skill-damage: '&8>> &7你使用 &b{skill} &7对 &f{target} &7造成了 &c{damage} &7点伤害'
    take-damage: '&8<< &f{attacker} &7对你造成了 &c{damage} &7点伤害'
    take-skill-damage: '&8<< &f{attacker} &7使用 &b{skill} &7对你造成了 &c{damage} &7点伤害'
    crit-tag: ' &4*暴击!'
    dodge-attacker: '&8- &f{target} &7闪避了你的攻击'
    dodge-target: '&8- &a你闪避了 &f{attacker} &a的攻击'
    lifesteal-tag: ' &a+{heal}'
    stun-apply: '&8# &7你对 &f{target} &7施加了 &e眩晕 &8| &f{duration}秒'
    stun-target: '&8# &f{attacker} &7对你施加了 &e眩晕 &8| &f{duration}秒'
    root-apply: '&8# &7你对 &f{target} &7施加了 &e禁锢 &8| &f{duration}秒'
    root-target: '&8# &f{attacker} &7对你施加了 &e禁锢 &8| &f{duration}秒'
    silence-apply: '&8# &7你对 &f{target} &7施加了 &e沉默 &8| &f{duration}秒'
    silence-target: '&8# &f{attacker} &7对你施加了 &e沉默 &8| &f{duration}秒'
    # 隐身消息（仅隐身者自己可见）
    invis-enter: '&8* &7你进入了 &f隐身 &8| &7持续 &f{duration}秒'
    invis-end: '&8* &7你的 &f隐身 &7已解除'
    # 减疗消息（mortal-wound：所有回血来源削减50%）
    mortal-wound-apply: '&8# &7你对 &f{target} &7施加了 &c减疗 &8| &f{duration}秒'
    mortal-wound-target: '&8# &f{attacker} &7对你施加了 &c减疗 &8| &f{duration}秒'
    mortal-wound-expire: '&8* &7你的 &c减疗 &7已解除'
    # 自然伤害消息（燃烧/摔落/岩浆等）{type}=伤害类型中文名, {damage}=伤害值
    natural-damage: '&8<< &7你受到了 &e{type} &7伤害 &c{damage}'
    # 治疗消息 {target}=被治疗者, {healer}=施术者, {amount}=治疗量
    heal-deal: '&8>> &7你对 &f{target} &7恢复了 &a{amount} &7点生命值'
    heal-receive: '&8<< &f{healer} &7为你恢复了 &a{amount} &7点生命值'
  #
  # 越级作战设置（仅对 MythicMobs 怪物生效）
  # 依赖 MM 怪物配置中的"怪物等级"字段（未配置时视为 0，此机制不会生效）
  # 说明：
  #   - curve 键 = 等级差，值 = 伤害/经验倍率；查表用 floor(diff)
  #   - damage: diff = 怪物等级 - 玩家等级
  #   - exp:    diff = 玩家等级 - 怪物等级
  #   - 首次加载时若 level-gap 段完全缺失，插件会写入默认曲线；已存在则不动
  #   - 用户可自由删除/新增 curve 条目，插件不会再自动补回被删除的键
  #   - 请勿在 curve 数值后写行内注释（会被序列化进字符串导致解析失败）
  level-gap: {}
  #
  # 仇恨系统设置（仅对 MythicMobs 怪物生效）
  threat:
    # 是否启用仇恨系统
    enabled: true
    # 治疗仇恨的最大距离（格）
    heal-range: 25.0
    # 治疗仇恨倍率（治疗量 × 此值 = 仇恨值）
    heal-multiplier: 0.5
    # 脱战时间（秒），超过此时间无新仇恨则清空仇恨表
    combat-timeout: 5.0
#
# 回血控制设置
Healing:
  #
  # 是否允许饱食度满时自然恢复生命值
  # false = 饱食度满了也不会自然回血（药水和技能治疗不受影响）
  allow-saturation-regen: false
#
# 自然伤害百分比扣除（按原版20点最大生命值为基准换算）
# 公式：新伤害 = 目标最大生命值 × (原始伤害 / 20)
# 例如玩家最大生命200，仙人掌原本扣1点 → 现在扣 200 × (1/20) = 10点
NaturalDamage:
  #
  # 总开关（关闭时所有自然伤害保持原版数值）
  enabled: true
  #
  # 仅对玩家生效（关闭时怪物也按比例缩放）
  player-only: true
  #
  # 应用 SkillAPI 自然伤害防御减伤（玩家用 natural-defense 字段，MM怪物用"自然防御"字段）
  # 开启后：燃烧/岩浆/中毒等会被独立的"自然防御"减免，与物理防御解耦
  # 关闭后：百分比伤害穿透防御，强制环境威胁
  apply-defense: true
  #
  # 每种伤害类型的独立开关
  types:
    fire: true              # 直接火焰伤害（站在火上）
    fire-tick: true         # 燃烧持续伤害
    lava: true              # 岩浆
    drowning: true          # 缺氧
    suffocation: true       # 窒息（卡方块）
    contact: true           # 接触伤害（仙人掌）
    fall: true              # 摔落伤害
    poison: true            # 中毒
    wither: true            # 凋零效果
    magic: true             # 瞬间伤害药水/末影龙吐息
    starvation: true        # 饥饿
    hot-floor: true         # 岩浆块灼烧
    cramming: true          # 拥挤伤害（1.13+）
    dragon-breath: true     # 末影龙吐息
    fly-into-wall: true     # 撞墙（鞘翅）
    lightning: true         # 闪电
    thorns: true            # 荆棘附魔反伤
    void: false             # 虚空（建议关闭，避免百分比换算导致死不掉）
#
# 法力值设置
Mana:
  #
  # 是否启用法力值系统
  enabled: true
  #
  # 法力恢复间隔（秒）
  freq: 5
#
# 技能设置
Skills:
  #
  # 是否允许降级技能
  allow-downgrade: true
  #
  # 施放技能时是否显示消息
  show-messages: true
  #
  # 技能施放消息的显示范围（格）
  message-radius: 20
  #
  # 伤害被增减效果抵消时是否仍然产生击退
  knockback-no-damage: false
  #
  # 动态技能方块机制忽略的方块（末尾加*为模糊匹配）
  block-filter:
  - 'chest'
  - 'ender chest'
  - 'trapped chest'
  - 'redstone*'
  - 'wall sign'
  - 'sign post'
#
# 物品设置
Items:
  #
  # 是否检查物品lore中的职业/等级/属性需求
  lore-requirements: true
  #
  # 是否检查物品lore中的技能需求
  skill-requirements: false
  #
  # 是否检查物品lore中的属性加成
  lore-attributes: true
  #
  # 无法使用武器时是否掉落
  drop-weapon: true
  #
  # lore中职业需求的文本
  lore-class-text: '职业要求: '
  #
  # lore中技能需求的文本
  lore-skill-text: 'Requires {skill}: '
  #
  # lore中等级需求的文本
  lore-level-text: '等级要求: '
  #
  # lore中排除职业的文本
  lore-exclude-text: '拒绝职业: '
  #
  # lore中属性需求的文本
  lore-attribute-text: '需要属性 {attr}: '
  #
  # lore中属性加成的文本
  attribute-text: '{attr}: '
  #
  # 每tick检查装备需求的玩家数（大服增大此值）
  players-per-check: 1
  #
  # 检查lore属性的装备槽位
  # 0-8=快捷栏, 36=靴子, 37=护腿, 38=胸甲, 39=头盔, 40=副手
  slots:
  - '36'
  - '37'
  - '38'
  - '39'

#
# GUI显示设置
GUI:
  #
  # 是否锁定血条为10颗心（不影响实际血量）
  # SX-Attribute 负责血条缩放时关闭本地缩放，避免客户端显示互相覆盖。
  old-health-bar: false
  #
  # 是否强制覆盖其他插件的血量显示
  force-scaling: true
  #
  # 经验条显示内容: none/mana/level
  level-bar: level
  #
  # 饥饿条显示内容: none/mana/exp
  food-bar: none
  #
  # 是否使用ActionBar
  use-action-bar: true
  #
  # ActionBar显示文本
  # 可用变量:
  #   {combo}       - 当前连击组合
  #   {class}       - 主职业名称
  #   {level}       - 主职业等级
  #   {exp}         - 当前经验值
  #   {expReq}      - 升级所需经验
  #   {expLeft}     - 距下一级还差多少经验
  #   {health}      - 当前生命值
  #   {maxHealth}   - 最大生命值
  #   {mana}        - 当前法力值
  #   {maxMana}     - 最大法力值
  #   {name}        - 玩家名
  #   {attr}        - 属性点数
  #   {sp}          - 技能点数
  #   {value:<key>} - 技能数值
  action-bar-text: '  &c&l❤:&c{health}&6/&c{maxHealth}    &e&l%sapi_mana_name%:&e{mana}&6/&e{maxMana}    &aExp:{exp}&6/&a{expReq}'

  #
  # 是否使用标题消息
  title-enabled: true
  #
  # 标题持续时间（秒）
  title-duration: 1
  #
  # 标题淡入时间（秒）
  title-fade-in: 0.5
  #
  # 标题淡出时间（秒）
  title-fade-out: 0.5
  #
  # 使用标题显示的消息类型: level_up, exp_gained, exp_lost, status
  title-messages:
  - level_up
  - exp_lost
  #
  # 是否使用计分板显示职业信息
  scoreboard-enabled: false
  #
  # 是否在玩家名前显示职业名前缀
  show-class-name: false
  #
  # 是否在玩家名下方显示等级
  show-class-level: false
  #
  # 等级文本格式（显示为: {等级} {文本}）
  class-level-text: 'Lv.'
  #
  # 是否使用地图技能树（替代常规GUI）
  # 设为 "partial" 可同时支持两种
  map-tree-enabled: false
#
# 连击系统设置
Click Combos:
  #
  # 是否启用点击连击系统
  enabled: false
  #
  # 是否允许玩家自定义连击
  allow-custom: false
  #
  # 是否允许左键点击
  use-click-left: true
  #
  # 是否允许右键点击
  use-click-right: true
  #
  # 是否允许Shift点击
  use-click-shift: false
  #
  # 完成连击所需的点击次数
  combo-size: 4
  #
  # 连击重置的无操作时间（秒）
  click-time: 1.0
#
# 技能栏设置
Skill Bar:
  #
  # 是否启用技能栏
  enabled: false
  #
  # 是否在技能栏显示冷却时间
  show-cooldown: true
  #
  # 技能栏空位占位物品
  empty-icon:
    material: PUMPKIN_SEEDS
    data: 0
    text: '&7未分配'
  #
  # 技能栏默认布局（skill=true表示技能槽，false表示物品槽）
  layout:
    1:
      skill: true
      locked: false
    2:
      skill: true
      locked: false
    3:
      skill: true
      locked: false
    4:
      skill: true
      locked: false
    5:
      skill: true
      locked: false
    6:
      skill: false
      locked: false
    7:
      skill: false
      locked: false
    8:
      skill: false
      locked: false
    9:
      skill: false
      locked: false
  #
  # 防具自动装配技能栏
  # 启用后，会扫描玩家穿戴防具的lore，匹配 detect-text 中的格式提取技能名，
  # 然后按 slot-mapping 的对应关系自动装配到技能栏槽位
  armor-auto-bind:
    enabled: false
    # 检测文本模板，{skill}会替换为技能名
    detect-text: '附带技能: {skill}'
    # 防具→槽位映射（槽位编号1-9）
    # helmet=头盔、chestplate=胸甲、leggings=护腿、boots=靴子、offhand=副手
    slot-mapping:
      helmet: 1
      chestplate: 2
      leggings: 3
      boots: 4
      offhand: 5
    # 副手白名单：只有lore中包含此文本的物品才能放入副手槽
    # 设为 NONE 则不限制副手
    offhand-whitelist-lore: 'NONE'
#
# 经验值设置
Experience:
  #
  # 是否使用原版经验球作为职业经验
  # 注意: 掉落的经验不算职业经验，只有启用的来源才算
  use-exp-orbs: true
  #
  # 是否屏蔽刷怪笼产生的怪物经验
  block-mob-spawner: true
  #
  # 是否屏蔽刷怪蛋产生的怪物经验
  block-mob-egg: true
  #
  # 是否在创造模式下屏蔽经验获取
  block-creative: true
  #
  # 获得经验时是否显示消息
  exp-message-enabled: true
  #
  # 升级时是否显示消息
  level-message-enabled: true
  #
  # 死亡丢失经验时是否显示消息
  lose-exp-message: true
  #
  # 升级经验公式: x*lvl*lvl + y*lvl + z
  formula:
    x: 1
    y: 8
    z: 16
  #
  # 是否使用自定义公式
  use-custom: false
  #
  # 自定义公式（lvl为当前等级）
  custom-formula: '25(1.1^(lvl-1))'
  #
  # 各怪物击杀经验值（启用经验球时忽略此项）
  yields:
    blaze: 10
    cavespider: 5
    creeper: 3
    elderguardian: 10
    enderdragon: 400
    enderman: 5
    endermite: 3
    ghast: 5
    giant: 20
    guardian: 10
    irongolem: 10
    magmacube: 1
    pigzombie: 5
    player: 5
    shulker: 5
    silverfish: 2
    skeleton: 3
    slime: 1
    spider: 3
    witch: 3
    wither: 500
    witherskeleton: 5
    zombie: 2
#
# 日志设置（调试用，0=关闭，1-5=详细程度）
Logging:
  #
  # 属性加载日志
  attribute-load: 0
  #
  # 攻击/防御增减效果日志
  buff: 0
  #
  # 技能和职业注册日志
  registration: 0
  #
  # GUI更新日志
  gui: 0
  #
  # 法力更新日志
  mana: 0
#
# 世界限制设置
Worlds:
  #
  # 是否启用世界限制
  enable: false
  #
  # true=仅列表中的世界可用SkillAPI
  # false=列表中的世界禁用SkillAPI
  use-as-enabling: true
  #
  # 世界列表
  worlds:
  - world
# ProSkillAPI 与 SX-Attribute 双向桥接；SX 侧也必须显式开启。
SX-Attribute:
  enabled: false
