name: SkillAPI
main: com.sucy.skill.SkillAPI
# Match the Gradle artifact version and GitHub release tag for this build.
version: R-1.3.0
authors: [Eniripsa96, Sentropic, 枫溪]
# Bukkit's depend syntax accepts plugin names only; the required MCCore
# release is 3.0.6 and is pinned by the build artifact and release notes.
depend: [MCCore]
softdepend: [Vault, ProtocolLib, Parties, RPGInventory, LibsDisguises, PlaceholderAPI, NoCheatPlus, MythicMobs, WorldGuard, WorldEdit, DragonCore]
loadbefore: [Quests]
# Do not declare api-version here: Bukkit only introduced that key in 1.13,
# while this plugin still supports 1.12.2. Cross-version modules select the
# actual server behavior at runtime, and omitting the key lets the legacy
# server parse the descriptor without treating a newer API as a requirement.

permissions:
  skillapi.basic:
    description: access to skill trees and using skills
    default: true
  skillapi.reset:
    description: access to resetting your class
    default: true
  skillapi.exp:
    description: access to gaining exp
    default: true
  skillapi.level:
    description: access to using the level and exp commands
    default: op
  skillapi.mana:
    description: access to using the mana command
    default: op
  skillapi.points:
    description: access to using the points command
    default: op
  skillapi.reload:
    description: access to using the reload command
    default: op
  skillapi.class:
    description: access to all classes
    default: op
  skillapi.skill:
    description: access to all skills
    default: op
  skillapi.lore:
    description: access to all lore commands
    default: op
  skillapi.force:
    description: access to force commands
    default: false
  skillapi.attrib:
    description: access to giving attribute points
    default: op
  skillapi.gui:
    description: access to GUI editor menu
    default: op

  skillapi.*:
    description: access to all commands and features
    default: op
    children:
      skillapi.basic: true
      skillapi.reset: true
      skillapi.exp: true
      skillapi.level: true
      skillapi.mana: true
      skillapi.points: true
      skillapi.reload: true
      skillapi.class: true
      skillapi.skill: true
      skillapi.lore: true
      skillapi.gui: true
