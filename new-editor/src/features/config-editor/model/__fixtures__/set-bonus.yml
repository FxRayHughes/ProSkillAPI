# =====================================================================
#  套装效果配置文件 (set-bonus.yml)
# ---------------------------------------------------------------------
#  本文件配置玩家穿戴套装件数达到指定数量后获得的「技能加成」与
#  「属性加成」。运行时插件会自动把同步给玩家的技能塞到技能栏空闲槽，
#  并把属性加成累加到玩家身上；脱下装备时自动撤销。
#
#  生效范围：4 件防具（头/胸/腿/靴）+ 副手 → 最多 5 件
#  匹配规则：去掉颜色码后，物品任一行 lore 包含 detect-lore 字符串
#  叠加规则：「向下包含」—— 穿 4 件时 count-2 和 count-4 同时生效
# =====================================================================

# ---------------------------------------------------------------------
#  套装 1：凤凰圣装（演示技能 + 属性双加成）
# ---------------------------------------------------------------------
#  套装 key 名（凤凰圣装、example_set 等）随便起，不要重复即可
#  玩家只要装备的 lore 上有「凤凰圣装」这四个字，就算这个套装的一件
凤凰圣装:
  # detect-lore: 检测字符串。物品 lore 任意一行 "包含" 这个字符串即算该套装一件。
  # 注意：
  #   1. 匹配前会自动去掉颜色码（&c &l 等），所以这里写纯文字即可
  #   2. 写 "NONE" 或留空 → 本条套装被跳过，不生效
  #   3. 字符串区分大小写，但匹配的是 contains 而非全等
  detect-lore: '凤凰圣装'

  # bonuses: 按件数赠送技能（技能名是 SkillAPI 里 skill yml 的文件名/技能 key）
  # 向下包含：穿 4 件时，count-2 + count-4 的技能列表全部给玩家
  bonuses:
    # 凑齐 2 件 → 自动获得「炎之护盾」
    count-2:
      - 炎之护盾
    # 凑齐 4 件 → 额外获得「凤凰涅槃」「火焰冲刺」
    count-4:
      - 凤凰涅槃
      - 火焰冲刺

  # ---------------------------------------------------------------------
  #  attribute-bonuses: 按件数累加 SkillAPI 属性
  # ---------------------------------------------------------------------
  #  ⚠️ 重要：属性 key 必须是 attributes.yml 的「顶级 key（中文 attribute name）」，
  #     **不是** attributes.yml 顶部那张 stat-key 速查表里的英文！
  #     stat-key（health/physical-damage/...）是属性内部的「作用域」，
  #     attribute name（生命值/武器伤害/...）才是玩家可投点、插件可识别的属性。
  #     运行时 SkillAPI 调用 AttributeManager.normalize()，
  #     传 stat-key 会抛 "Invalid attribute" 异常，被静默吞掉 → 加成不生效。
  #
  #  其他规则：
  #     1. 数值必须是整数（小数会被截断/忽略）
  #     2. 「向下包含」叠加：穿 4 件时，count-2 + count-4 的属性都累加
  #        例如 生命值: 穿 4 件 = 50 + 100 = 150
  #     3. 加成等同于"临时投入属性点"，会经过该属性的公式（v、a+v 等）放大
  #        例如 力量 +5 不是直接 +5 物理伤害，而是相当于在「力量」上投了 5 点，
  #        最终输出按力量的公式换算
  # ---------------------------------------------------------------------
  attribute-bonuses:
    count-2:
      生命值: 50 # 生命上限 +50
      魔力值: 20 # 魔力上限 +20
    count-4:
      生命值: 100 # 再叠 100（与上面累加，共 +150）
      武器伤害: 10 # 武器伤害 +10
      暴击率: 5 # 暴击率 +5%
      生命偷取: 3 # 生命偷取 +3%

# ---------------------------------------------------------------------
#  套装 2：暗影刺客套（演示 2/3/5 档位 + 副手匕首计入件数）
# ---------------------------------------------------------------------
#  注意：副手物品也会被检测，所以匕首/法器只要 lore 里有"暗影刺客"就算一件。
#  这里给出 5 档示例（满件套），向下包含意味着穿满 5 件时会同时享有
#  count-2/3/5 全部加成。
暗影刺客套:
  detect-lore: '暗影刺客'
  bonuses:
    count-2:
      - 暗影潜行
    count-3:
      - 致命突袭
    count-5: # 满件（4防具 + 1副手匕首）
      - 影分身
  attribute-bonuses:
    count-2:
      敏捷: 5 # 敏捷 +5（间接提升移速/闪避等敏捷系派生属性）
      力量: 5 # 力量 +5
    count-3:
      暴击率: 10 # 暴击率 +10%
      暴击伤害: 20 # 暴击伤害额外 +0.2x
    count-5:
      固定穿透: 15 # 固定穿透 +15
      生命偷取: 5 # 生命偷取 +5%

# ---------------------------------------------------------------------
#  套装 3：纯技能套（最简形式，没有属性加成也合法）
# ---------------------------------------------------------------------
#  bonuses 和 attribute-bonuses 至少有一个非空即可被加载
#  下面的写法是 MCCore 时代经典 SkillAPI 兼容写法
学徒法师套:
  detect-lore: '学徒法师'
  bonuses:
    count-2:
      - 法力涌动
    count-4:
      - 奥术轰击
# ---------------------------------------------------------------------
#  套装 4：纯属性套（也可以没有 bonuses，只配属性）
# ---------------------------------------------------------------------
暗影套装:
  detect-lore: '暗影套装'
  attribute-bonuses:
    count-2:
      生命值: 100
      防御力: 30
      体质: 10 # 体质 +10（提升生命/防御等体质系派生属性）
    count-4:
      生命值: 200 # 累计 +300
      防御力: 50 # 累计 +80
      仇恨强度: 50 # 仇恨强度 +50%（坦克吸怪用，仅对 MM 怪物生效）
      防击退: 100 # 防击退 +100

# =====================================================================
#  装备 lore 该怎么写
# ---------------------------------------------------------------------
#  套装识别是「lore 包含」匹配，不要求一整行一致。下面是 3 种实战写法：
#
#  写法 A：单独一行套装标识
#     物品 lore:
#       - "&7一把炽热的战戟"
#       - "&6&l[凤凰圣装]"        ← 这一行包含「凤凰圣装」 → 计入凤凰圣装
#       - "&8强度: +25"
#
#  写法 B：套装名混在描述里
#     物品 lore:
#       - "&6凤凰圣装的传承之物"   ← 包含「凤凰圣装」 → 计入
#
#  写法 C：多套装兼容（一件装备同时算多个套装）
#     物品 lore:
#       - "&6&l[凤凰圣装]"
#       - "&c&l[暗影刺客]"        ← 两条套装都会各 +1
#
#  注意点：
#   * 颜色码会被自动去掉，所以 lore 里有 &6 &l 不影响识别
#   * 物品名（display name）不参与匹配，只看 lore
#   * 一件装备可同时匹配多个套装（如混搭通用部件）
# =====================================================================

# =====================================================================
#  attribute-bonuses 可用属性 key（22 个 attribute name）
# ---------------------------------------------------------------------
#  ⚠️ 这是 attributes.yml 的「顶级 key」，**不是** stat-key！
#     stat-key（physical-damage / health / crit-rate 等）填进去无效。
#
#  attributes.yml 的结构是：
#     ┌─ 武器伤害:              ← 这里才是 attribute-bonuses 要填的 key
#     │    display: '武器伤害'
#     │    stats:
#     │      physical-damage: 'a+v'  ← 这个 stat-key 不要填进 set-bonus.yml
#     └─ ...
#
#  当前 attributes.yml 里可用的全部 22 个顶级 key：
#
#    伤害类：    武器伤害 / 法杖伤害 / 物理强度 / 魔法强度 / 治疗强度
#    人物属性：  力量 / 体质 / 智力 / 敏捷
#    基础值：    生命值 / 魔力值 / 魔力恢复
#    战斗扩展：  伤害强度 / 防击退 / 防御力 / 冷却缩减
#                暴击率 / 暴击伤害 / 生命偷取 / 破甲 / 固定穿透 / 仇恨强度
#
#  数值都是整数。百分比类（暴击率/生命偷取/破甲等）填 10 就是 10%。
#  力量/体质/智力/敏捷 等"属性点"加成会经过对应公式放大，相当于临时投点。
# =====================================================================

# ---------------------------------------------------------------------
#  禁用条目（示例：保留配置但临时关掉）
# ---------------------------------------------------------------------
#  把 detect-lore 改成 NONE，整条套装就不会被加载
#  （也不会留下属性残留，因为压根不进 SetBonusEntry 字典）
龙鳞战甲套:
  detect-lore: 'NONE' # 暂时禁用，去掉 NONE 改回真实 lore 就恢复
  bonuses:
    count-2:
      - 龙息吐纳
    count-4:
      - 龙鳞铁壁
